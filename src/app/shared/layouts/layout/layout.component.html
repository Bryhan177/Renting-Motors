<ng-container *ngIf="isPublicShell(); else appShell">
  <main class="min-h-screen bg-[#0c0e10]">
    <router-outlet></router-outlet>
  </main>
</ng-container>

<ng-template #appShell>
  <app-header></app-header>
  <div class="app-shell-row">
    <ng-container *ngIf="showSidebar()">
      <app-sidebar></app-sidebar>
    </ng-container>
    <main class="app-shell-main fondo">
      <router-outlet></router-outlet>
    </main>
  </div>
  <app-footer></app-footer>
</ng-template>
