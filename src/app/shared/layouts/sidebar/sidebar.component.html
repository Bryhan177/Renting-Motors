<!-- Hamburguesa: flotante, no empuja el contenido -->
<button
  type="button"
  class="sidebar-toggle"
  (click)="toggleSidebar()"
  aria-label="Abrir menú"
>
  ☰
</button>

<!-- Fondo oscuro al abrir en móvil -->
<div
  class="sidebar-backdrop"
  *ngIf="showSidebar"
  (click)="closeSidebar()"
  aria-hidden="true"
></div>

<aside class="sidebar-panel" [class.is-open]="showSidebar">
  <div class="sidebar-head">
    <span class="sidebar-user">{{ userName }}</span>
    <button type="button" class="sidebar-close" (click)="closeSidebar()" aria-label="Cerrar menú">
      ✕
    </button>
  </div>

  <nav class="sidebar-nav">
    <a (click)="goDashboard()">Dashboard</a>
    <a (click)="goMotos()">MDD</a>
    <a (click)="goContratos()">Contratos</a>
    <a (click)="goPlanes()">Planes</a>
    <a (click)="goUsuarios()">Usuarios</a>
    <a (click)="goPagos()">Pagos</a>
    <a (click)="goMantenimientos()">Mantenimientos</a>
    <a (click)="goFlujoCaja()">Flujo de caja</a>
    <a (click)="goHistorial()">Historial MDD</a>
    <a (click)="goDocumentacion()">Documentación</a>
  </nav>

  <div class="sidebar-foot">
    <button type="button" class="sidebar-logout" (click)="logout()">Cerrar sesión</button>
  </div>
</aside>
