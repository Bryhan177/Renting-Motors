<button class="md:hidden top-0 right-0 text-gray-800 hover:text-gray-600 transition-colors bg-transparent border-none outline-none" (click)="toggleSidebar()">
  <span class="text-2xl">☰</span>
</button>
<div class="flex h-screen flex-col md:flex-row">
  <aside
    [ngClass]="{
      'translate-x-0': showSidebar,
      '-translate-x-full': !showSidebar
    }"
    class="fixed md:relative top-0 left-0 h-full w-64 bg-gray-900 text-white shadow-lg transform transition-transform duration-300 ease-in-out z-50 md:translate-x-0"
  >
    <div class="flex items-center justify-center h-20 border-b border-gray-700">
      <span class="text-xl font-bold tracking-wide">{{ userName }}</span>
    </div>

    <span class="text-2xl cursor-pointer absolute top-6 right-3 md:hidden" (click)="toggleSidebar()">☰</span>

    <nav class="flex-1 py-6 px-4 space-y-1 cursor-pointer overflow-y-auto">
      <a (click)="goDashboard()" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 transition">
        <span>Dashboard</span>
      </a>
      <a (click)="goMotos()" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 transition">
        <span>MDD</span>
      </a>
      <a (click)="goUsuarios()" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 transition">
        <span>Usuarios</span>
      </a>
      <a (click)="goPagos()" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 transition">
        <span>Pagos</span>
      </a>
      <a (click)="goMantenimientos()" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 transition">
        <span>Mantenimientos</span>
      </a>
      <a (click)="goFlujoCaja()" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 transition">
        <span>Flujo de caja</span>
      </a>
      <a (click)="goHistorial()" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 transition">
        <span>Historial MDD</span>
      </a>
      <a (click)="goDocumentacion()" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 transition">
        <span>Documentación</span>
      </a>
    </nav>

    <div class="p-4 border-t border-gray-700">
      <button
        class="w-full flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg transition"
        (click)="logout()"
      >
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>
</div>
