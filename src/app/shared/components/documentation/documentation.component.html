<div class="min-h-screen bg-gray-900 text-white p-6 rounded-xl">
  <div class="flex justify-between items-center mb-6 gap-4 flex-wrap">
    <div>
      <h1 class="text-3xl font-bold text-white">Documentación</h1>
      <p class="text-gray-300 mt-1">Contratos PDF, CC, licencia y matrícula MDD</p>
    </div>
    <button (click)="abrirSubir()" class="bg-blue-600 hover:bg-blue-500 text-white py-2.5 px-5 rounded-lg">Subir documento</button>
  </div>

  <div class="flex flex-wrap gap-2 mb-6">
    <button *ngFor="let c of categorias" (click)="cambiarTab(c.id)"
            [class.bg-blue-600]="tab === c.id"
            class="px-3 py-1.5 rounded-lg text-sm bg-gray-800 text-white border border-gray-700">
      {{ c.label }}
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngIf="documentos.length === 0" class="col-span-full text-center text-gray-400 py-12 border border-dashed border-gray-700 rounded-xl">
      No hay documentos en esta categoría
    </div>
    <div *ngFor="let d of documentos" class="bg-gray-800 border border-gray-700 rounded-xl p-4 flex flex-col gap-3">
      <div class="flex justify-between gap-2">
        <span class="text-xs px-2 py-1 rounded bg-gray-700 text-gray-200">{{ labelCat(d.categoria) }}</span>
        <span class="text-xs text-gray-400">{{ d.createdAt | date:'shortDate' }}</span>
      </div>
      <h3 class="font-bold text-white truncate">{{ d.nombre }}</h3>
      <p class="text-sm text-gray-400 line-clamp-2">{{ d.descripcion || 'Sin descripción' }}</p>
      <div class="flex gap-2 mt-auto">
        <button (click)="descargar(d)" class="flex-1 bg-emerald-700 hover:bg-emerald-600 text-white text-sm py-2 rounded-lg">Ver / Descargar</button>
        <button (click)="eliminar(d)" class="px-3 bg-red-700 hover:bg-red-600 text-white text-sm py-2 rounded-lg">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<div *ngIf="mostrarModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
  <div class="bg-gray-800 rounded-2xl w-full max-w-md border border-gray-600 text-white p-5 space-y-3">
    <h3 class="text-xl font-bold">Subir documento</h3>
    <select [(ngModel)]="form.categoria" class="w-full bg-gray-900 border border-gray-500 rounded-lg px-3 py-2 text-white">
      <option value="contrato_plantilla">Contrato PDF (plantilla)</option>
      <option value="cc_cliente">Cédula del cliente</option>
      <option value="licencia">Licencia</option>
      <option value="matricula_mdd">Matrícula MDD</option>
      <option value="otro">Otro</option>
    </select>
    <input [(ngModel)]="form.nombre" placeholder="Nombre" class="w-full bg-gray-900 border border-gray-500 rounded-lg px-3 py-2 text-white">
    <input [(ngModel)]="form.descripcion" placeholder="Descripción" class="w-full bg-gray-900 border border-gray-500 rounded-lg px-3 py-2 text-white">
    <select [(ngModel)]="form.conductorId" class="w-full bg-gray-900 border border-gray-500 rounded-lg px-3 py-2 text-white">
      <option [ngValue]="null">Sin conductor</option>
      <option *ngFor="let c of conductores" [value]="c._id">{{ c.nombre }} {{ c.apellido }}</option>
    </select>
    <select [(ngModel)]="form.motoId" class="w-full bg-gray-900 border border-gray-500 rounded-lg px-3 py-2 text-white">
      <option [ngValue]="null">Sin MDD</option>
      <option *ngFor="let m of motos" [value]="m._id">{{ m.placa }}</option>
    </select>
    <input type="file" accept=".pdf,image/*,.doc,.docx" (change)="onFile($event)" class="text-sm text-white">
    <div class="flex justify-end gap-2">
      <button (click)="mostrarModal=false" class="px-4 py-2">Cancelar</button>
      <button (click)="subir()" class="px-4 py-2 bg-blue-600 rounded-lg">Subir</button>
    </div>
  </div>
</div>
