<section class="auth-page">
  <button type="button" class="auth-back" (click)="goHome()">← Volver</button>

  <div class="auth-shell">
    <div class="auth-visual">
      <img src="assets/images/login.png" alt="Login GoRenting" />
    </div>

    <div class="auth-form-wrap">
      <img src="assets/images/icon.png" alt="GoRenting" class="auth-icon" />
      <h2 class="auth-title">Bienvenido de nuevo</h2>
      <p class="auth-lead">Inicia sesión para continuar</p>

      <form class="auth-form" (ngSubmit)="onLogin()" #loginForm="ngForm">
        <label class="auth-label" for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="correo@gmail.com"
          class="auth-input"
        />

        <label class="auth-label" for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="••••••••"
          class="auth-input"
        />

        <button type="submit" class="auth-submit">Iniciar sesión</button>

        <p *ngIf="error" class="auth-error">{{ error }}</p>
      </form>

      <p class="auth-switch">
        ¿No tienes cuenta?
        <a (click)="goToRegister()" class="auth-link">Regístrate</a>
      </p>
    </div>
  </div>
</section>
