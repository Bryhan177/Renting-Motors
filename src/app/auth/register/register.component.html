<section class="auth-page">
  <a routerLink="/" class="auth-back">← Volver</a>

  <div class="auth-shell">
    <div class="auth-visual">
      <img src="assets/images/register.png" alt="Registro GoRenting" />
    </div>

    <div class="auth-form-wrap">
      <p class="auth-brand">GoRenting</p>
      <h2 class="auth-title">Registro de conductor</h2>
      <p class="auth-lead">
        Crea tu cuenta. Un administrador o asesor te asignará el rol después en el panel.
      </p>

      <form (ngSubmit)="agregarUsuario()" class="auth-grid">
        <div>
          <label class="auth-label">Nombre</label>
          <input name="nombre" [(ngModel)]="nuevoUsuario.nombre" class="field" placeholder="Nombre" />
        </div>
        <div>
          <label class="auth-label">Apellido</label>
          <input name="apellido" [(ngModel)]="nuevoUsuario.apellido" class="field" placeholder="Apellido" />
        </div>
        <div class="span-2">
          <label class="auth-label">Correo</label>
          <input type="email" name="email" [(ngModel)]="nuevoUsuario.email" class="field" placeholder="correo@gmail.com" />
        </div>
        <div>
          <label class="auth-label">Cédula</label>
          <input type="number" name="cedula" [(ngModel)]="nuevoUsuario.cedula" class="field" placeholder="1234567890" />
        </div>
        <div>
          <label class="auth-label">Edad</label>
          <input type="number" name="edad" [(ngModel)]="nuevoUsuario.edad" class="field" placeholder="25" min="18" max="90" />
        </div>
        <div class="span-2">
          <label class="auth-label">Teléfono</label>
          <input type="tel" name="telefono" [(ngModel)]="nuevoUsuario.telefono" class="field" placeholder="3001234567" />
        </div>
        <div>
          <label class="auth-label">Contraseña</label>
          <input type="password" name="password" [(ngModel)]="nuevoUsuario.password" class="field" placeholder="••••••••" />
        </div>
        <div>
          <label class="auth-label">Confirmar</label>
          <input type="password" name="confirmPassword" [(ngModel)]="nuevoUsuario.confirmPassword" class="field" placeholder="••••••••" />
        </div>

        <div class="span-2 terms">
          <input name="activo" type="checkbox" [(ngModel)]="nuevoUsuario.activo" class="accent-amber-500" />
          <label class="text-sm text-gray-300">Acepto términos y condiciones</label>
        </div>

        <div class="span-2">
          <button type="submit" class="auth-submit">Registrarme</button>
        </div>
      </form>

      <p class="auth-switch">
        ¿Ya tienes cuenta?
        <a routerLink="/login" class="auth-link">Inicia sesión</a>
      </p>
    </div>
  </div>
</section>
